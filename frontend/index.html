<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeAuthentic - Instructor Portal</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .auth-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .brand h1 { font-size: 1.75rem; font-weight: 700; color: #60a5fa; letter-spacing: -0.5px; }
    .brand p { font-size: 0.875rem; color: var(--muted); margin-top: 0.25rem; }
    .tab-group {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--muted);
      padding: 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    input {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--primary); }
    .btn-submit {
      width: 100%;
      padding: 0.8rem;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background-color 0.2s;
    }
    .btn-submit:hover { background-color: var(--primary-hover); }
    .alert {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      display: none;
    }
    .alert.error { background-color: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .alert.success { background-color: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
    .footer-note {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="brand">
      <h1>CodeAuthentic</h1>
      <p>CCIS - Caraga State University</p>
      <p style="font-size: 0.75rem; margin-top: 4px;">AI-Generated Source Code Detection System</p>
    </div>

    <div class="tab-group">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Register</button>
    </div>

    <div id="alert-box" class="alert"></div>

    <!-- Login Form -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="login-email">Instructor Email</label>
        <input type="email" id="login-email" required placeholder="instructor@carsu.edu.ph" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-submit" id="login-btn">Log In</button>
    </form>

    <!-- Register Form -->
    <form id="register-form" style="display: none;" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="reg-name">Full Name</label>
        <input type="text" id="reg-name" required placeholder="Prof. Juan Dela Cruz">
      </div>
      <div class="form-group">
        <label for="reg-email">Instructor Email</label>
        <input type="email" id="reg-email" required placeholder="instructor@carsu.edu.ph" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="reg-password">Password (min. 6 characters)</label>
        <input type="password" id="reg-password" minlength="6" required placeholder="••••••••" autocomplete="new-password">
      </div>
      <button type="submit" class="btn-submit" id="reg-btn">Create Account</button>
    </form>

    <div class="footer-note">
      Live Examination AI Code Integrity Verification
    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
